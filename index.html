function renderCareerProfileScreen(state) {
  const career = state.career;
  const code = state.careerViewDriverCode;
  const d = career.driverPool[code];
  if (!d) return `<div class="h-full flex items-center justify-center cm-body text-slate-500">Piloto não encontrado.</div>`;
  const team = d.teamId ? career.teams[d.teamId] : null;
  const isMine = d.teamId === state.playerTeamId;
  const happiness = d.happiness != null ? d.happiness : 65;
  const hTone = happiness >= 70 ? '#3ECF6E' : happiness >= 40 ? '#FFB020' : '#E8383D';
  const hLabel = happiness >= 80 ? 'Radiante' : happiness >= 60 ? 'Contente' : happiness >= 40 ? 'Neutro' : happiness >= 20 ? 'Insatisfeito' : 'Muito infeliz';
  const traits = driverTraits(d, team);
  const onCooldown = isMine && d.lastTalkRaceSeq != null && career.raceSequence - d.lastTalkRaceSeq < 1;
  const pendingTeamObj = d.pendingTeamId ? career.teams[d.pendingTeamId] : null;
  let pendingNote = '';
  if (d.pendingTeamId === null) pendingNote = `⚠ Sai da equipe no fim da temporada ${career.year} — vaga já tem substituto para ${career.year + 1}.`;
  else if (pendingTeamObj && d.pendingTeamId === d.teamId) pendingNote = `✓ Renovado — segue na equipe em ${career.year + 1}.`;
  else if (pendingTeamObj) pendingNote = `→ Confirmado na ${pendingTeamObj.name} a partir de ${career.year + 1}.`;
  const draft = state.contractUI || {};
  const isEditingContract = draft.targetCode === code;
  return `
    <div class="h-full flex flex-col overflow-hidden">
      ${careerHeader(state, 'Perfil do piloto')}
      <div id="screen-scroll" class="flex-1 min-h-0 overflow-y-auto p-4">
        <div class="flex items-center gap-2 mb-1">
          ${team ? `<span class="w-2.5 h-2.5 rounded-full" style="background-color:${team.color}"></span>` : ''}
          <span class="cm-display text-2xl font-bold text-slate-100">${d.name}</span>
        </div>
        <div class="cm-mono text-xs text-slate-500 mb-1">${d.age} anos · ${team ? team.name : 'sem equipe'} · ${roleLabel(d.role)}${d.retired ? ' · APOSENTADO' : ''}</div>
        ${pendingNote ? `<div class="cm-body text-xs text-amber-300 mb-4">${pendingNote}</div>` : '<div class="mb-4"></div>'}

        <div class="bg-slate-900 border border-slate-800 rounded-md p-3 mb-4">
          <div class="flex items-center justify-between mb-1">
            <span class="cm-body text-sm text-slate-300">😊 Felicidade</span>
            <span class="cm-mono text-sm" style="color:${hTone}">${hLabel}</span>
          </div>
          <div class="h-2 rounded-full bg-slate-800 overflow-hidden mb-2">
            <div class="h-full rounded-full" style="width:${happiness}%; background-color:${hTone}"></div>
          </div>
          ${isMine ? `<button data-talk-code="${d.code}" ${onCooldown ? 'disabled' : ''} class="w-full ${onCooldown ? 'bg-slate-900 border border-slate-800 text-slate-600' : 'bg-slate-800 border border-slate-700 text-slate-200'} rounded-md py-2 cm-body text-sm">${onCooldown ? 'Já conversaram essa corrida' : '💬 Conversar com o piloto'}</button>` : ''}
        </div>

        ${!isMine && !d.retired ? `<button data-action="${act({ type: 'CONTRACT_DRAFT_START', code: d.code })}" class="w-full bg-slate-800 border border-slate-700 rounded-md py-2 cm-body text-sm text-slate-200 mb-4">Negociar com este piloto</button>` : ''}

        ${isMine ? `
        <div class="bg-slate-900 border border-slate-800 rounded-md p-3 mb-4">
          <div class="flex items-center justify-between mb-2">
            <span class="cm-body text-sm text-slate-300">📝 Contrato</span>
            <span class="cm-mono text-xs text-slate-500">${fmtMoney(d.salary)}/corrida · ${d.contractYears} ano(s)</span>
          </div>
          ${isEditingContract ? contractDraftPanel(draft, code, false) : `<button data-action="${act({ type: 'CONTRACT_DRAFT_START', code })}" class="w-full bg-slate-800 border border-slate-700 rounded-md py-2 cm-body text-sm text-slate-200">Renegociar contrato</button>`}
        </div>` : ''}

        ${(traits.positives.length || traits.negatives.length) ? `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
          <div class="bg-slate-900 border border-emerald-900 rounded-md p-3">
            <div class="cm-mono text-xs text-emerald-400 mb-1.5">PONTOS FORTES DO PILOTO</div>
            ${traits.positives.length ? traits.positives.map(t => `<div class="cm-body text-xs text-slate-300 mb-1">✓ ${t}</div>`).join('') : '<div class="cm-body text-xs text-slate-600">Nada de excepcional ainda.</div>'}
          </div>
          <div class="bg-slate-900 border border-red-900 rounded-md p-3">
            <div class="cm-mono text-xs text-red-400 mb-1.5">O QUE ELE COBRA DA EQUIPE</div>
            ${traits.negatives.length ? traits.negatives.map(t => `<div class="cm-body text-xs text-slate-300 mb-1">✗ ${t}</div>`).join('') : '<div class="cm-body text-xs text-slate-600">Está satisfeito com o carro por enquanto.</div>'}
          </div>
        </div>` : ''}

        <div class="cm-mono text-xs text-slate-500 mb-1">HABILIDADES</div>
        ${skillBar('Experiência', d.experience)}${skillBar('Acerto com o carro', d.carFeel)}${skillBar('Chuva', d.wet)}
        ${skillBar('Ultrapassagem', d.overtaking)}${skillBar('Largada', d.starts)}${skillBar('Concentração', d.focus)}
        ${skillBar('Físico', d.physical)}${skillBar('Rapidez', d.pace)}
      </div>
      ${footerBackButton()}
    </div>
  `;
}

    <div class="h-full flex flex-col overflow-hidden">
      ${careerHeader(state, 'Notícias')}
      <div id="screen-scroll" class="flex-1 min-h-0 overflow-y-auto bg-slate-900 m-3 rounded-md border border-slate-800">${rows}</div>
      ${footerBackButton()}
    </div>
  `;
}

function renderCareerOffseasonScreen(state) {
  const career = state.career;
  const lastSeason = career.seasonHistory[career.seasonHistory.length - 1];
  const champCode = lastSeason ? lastSeason.driverChampionCode : null;
  const champ = champCode ? career.driverPool[champCode] : null;
  const constructorChamp = lastSeason ? career.teams[lastSeason.constructorChampionId] : null;
  const logHtml = (career.log || []).map(l => `<div class="cm-body text-xs text-slate-400 mb-1">• ${l}</div>`).join('');
  return `
    <div class="h-full flex flex-col overflow-hidden">
      <div class="shrink-0 safe-top bg-slate-950 border-b border-slate-800 px-3 py-3 text-center">
        <div class="cm-mono text-xs text-cyan-400">FIM DA TEMPORADA ${lastSeason ? lastSeason.year : career.year - 1}</div>
        <div class="cm-display text-2xl font-bold text-slate-100">Mercado de pilotos</div>
      </div>
      <div id="screen-scroll" class="flex-1 min-h-0 overflow-y-auto p-3">
        ${champ ? `<div class="bg-slate-900 border border-amber-700 rounded-md p-3 mb-2"><div class="cm-mono text-xs text-amber-400">CAMPEÃO DE PILOTOS</div><div class="cm-display text-lg font-bold text-slate-100">🏆 ${champ.name} — ${lastSeason.driverChampionPoints} pts</div></div>` : ''}
        ${constructorChamp ? `<div class="bg-slate-900 border border-slate-800 rounded-md p-3 mb-3"><div class="cm-mono text-xs text-slate-500">CAMPEÃ DE CONSTRUTORES</div><div class="cm-display text-lg font-bold text-slate-100">🏆 ${constructorChamp.name}</div></div>` : ''}
        <div class="cm-mono text-xs text-slate-500 mb-1">NOTÍCIAS DA ENTRESSAFRA</div>
        <div class="bg-slate-950 border border-slate-800 rounded-md p-3">${logHtml || '<div class="cm-body text-xs text-slate-600">Sem mudanças notáveis.</div>'}</div>
      </div>
      <div class="shrink-0 p-3">
        <button data-action="${act({ type: 'CAREER_ACK_OFFSEASON' })}" class="w-full bg-amber-500 text-slate-950 cm-body font-semibold py-3 rounded-md">Continuar para ${career.year}</button>
      </div>
    </div>
  `;
}

function renderCareerRaceResultScreen(state) {
  const { classified, fastestCar, playerCards, teamPoints } = raceOutcomeSummary(state);
  const career = state.career;
  const applied = state.careerLastRaceApplied || { pointsAwarded: {} };
  const driverRank = Object.entries(career.driverStandings).sort((a, b) => b[1] - a[1]);
  const constructorRank = Object.entries(career.constructorStandings).sort((a, b) => b[1] - a[1]);
  const myConstructorPos = constructorRank.findIndex(([id]) => id === state.playerTeamId) + 1;
  const isLastRound = career.roundIndex + 1 >= career.calendar.length;
  return `
    <div class="h-full flex flex-col p-3 sm:p-4 overflow-hidden">
      <div class="shrink-0">
        <div class="cm-mono text-xs text-slate-500 mb-1">RODADA ${career.roundIndex + 1}/${career.calendar.length} — ${state.circuit.name}</div>
        <h2 class="cm-display text-2xl font-bold mb-2 flex items-center gap-2"><span class="text-amber-400">🏆</span> Bandeirada</h2>
        <div class="grid grid-cols-2 gap-2 mb-2">${playerCards}</div>
        <div class="cm-body text-xs text-slate-300 mb-1">Pontos nesta corrida: <span class="text-amber-400 font-semibold">${teamPoints}</span> · Posição atual (construtores): <span class="text-cyan-300 font-semibold">P${myConstructorPos || '-'}</span></div>
        ${fastestCar ? `<div class="cm-body text-xs text-cyan-300 mb-2">⚡ Volta mais rápida: ${fastestCar.name} — ${fmtLapTime(fastestCar.bestLap)}</div>` : ''}
      </div>
      <div id="screen-scroll" class="flex-1 min-h-0 overflow-y-auto bg-slate-900 border border-slate-800 rounded-md">${classificationRows(classified)}</div>
      <div class="shrink-0 pt-2">
        <button data-action="${act({ type: 'CAREER_CONTINUE' })}" class="w-full bg-amber-500 text-slate-950 cm-body font-semibold py-2.5 rounded-md">${isLastRound ? 'Encerrar temporada →' : 'Continuar →'}</button>
      </div>
    </div>
  `;
}

/* ---------------- dispatcher e bootstrap ---------------- */

function renderApp(state) {
  const p = state.phase;
  if (p === 'menu') return renderMenuScreen();
  if (p === 'mode') return renderModeScreen();
  if (p === 'tutorial') return renderTutorialScreen(state);
  if (p === 'career-name') return renderCareerNameScreen(state);
  if (p === 'team') return renderTeamSelectScreen();
  if (p === 'circuit') return renderCircuitSelectScreen(state);
  if (p === 'quali') return renderQualiScreen(state);
  if (p === 'race') return renderRaceScreen(state);
  if (p === 'results') return renderResultsScreen(state);
  if (p === 'career-team') return renderCareerTeamSelectScreen();
  if (p === 'career-hub') return renderCareerHubScreen(state);
  if (p === 'career-news') return renderCareerNewsScreen(state);
  if (p === 'career-calendar') return renderCareerCalendarScreen(state);
  if (p === 'career-standings') return renderCareerStandingsScreen(state);
  if (p === 'career-contracts') return renderCareerContractsScreen(state);
  if (p === 'career-market') return renderCareerMarketScreen(state);
  if (p === 'career-sponsor-offer') return renderCareerSponsorOfferScreen(state);
  if (p === 'career-upgrades') return renderCareerUpgradesScreen(state);
  if (p === 'career-sponsors') return renderCareerSponsorsScreen(state);
  if (p === 'career-roster') return renderCareerRosterScreen(state);
  if (p === 'career-profile') return renderCareerProfileScreen(state);
  if (p === 'career-offseason') return renderCareerOffseasonScreen(state);
  if (p === 'career-race-result') return renderCareerRaceResultScreen(state);
  return `<div class="h-full flex items-center justify-center cm-body text-slate-500">tela desconhecida: ${p}</div>`;
}

const SAVE_KEY = 'pitwallManagerSaveV1';

function saveCareerToStorage(s) {
  if (s.mode !== 'career' || !s.career) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ playerTeamId: s.playerTeamId, career: s.career }));
  } catch (e) { /* storage unavailable (private mode / sandboxed preview / quota) — game still runs, just without persistence */ }
}

function repairLoadedCareer(career) {
  Object.values(career.teams).forEach(t => {
    if (typeof t.basePace !== 'number') t.basePace = 80;
    if (typeof t.baseReliability !== 'number') t.baseReliability = 80;
    if (!t.devLevels || !t.devInvest || !UPGRADE_CATEGORIES.every(c => typeof t.devLevels[c.id] === 'number')) {
      const dev = initDevLevels(t.basePace);
      t.devLevels = dev.devLevels;
      t.devLevelsStart = dev.devLevels;
      t.devInvest = t.devInvest && typeof t.devInvest === 'object' ? t.devInvest : dev.devInvest;
      UPGRADE_CATEGORIES.forEach(c => { if (typeof t.devInvest[c.id] !== 'number') t.devInvest[c.id] = 0; });
    } else if (!t.devLevelsStart) {
      t.devLevelsStart = { ...t.devLevels };
    }
    if (!Array.isArray(t.sponsorDeals)) t.sponsorDeals = [];
    if (typeof t.budget !== 'number' || Number.isNaN(t.budget)) t.budget = 30;
    if (!t.engineSupplierId) t.engineSupplierId = 'mercedes';
    if (!t.pendingEngineSupplierId) t.pendingEngineSupplierId = t.engineSupplierId;
    if (typeof t.engineConfirmedThisSeason !== 'boolean') t.engineConfirmedThisSeason = false;
    if (typeof t.engineContractYears !== 'number') t.engineContractYears = 1;
    if (!Array.isArray(t.driverCodes)) t.driverCodes = [];
  });
  Object.values(career.driverPool).forEach(d => {
    if (typeof d.cooldownUntilRaceSeq !== 'number') d.cooldownUntilRaceSeq = 0;
    if (typeof d.salary !== 'number') d.salary = estimateSalary(d);
    if (typeof d.contractYears !== 'number') d.contractYears = 2;
    if (typeof d.happiness !== 'number') d.happiness = 65;
    if (typeof d.lastTalkRaceSeq !== 'number') d.lastTalkRaceSeq = -99;
  });
  if (typeof career.managerName === 'undefined') career.managerName = null;
  if (typeof career.lastSeenLogCount !== 'number') career.lastSeenLogCount = (career.log || []).length;
  if (!Array.isArray(career.calendar) || !career.calendar.length) career.calendar = buildCalendarForYear(career.year || 2026);
  if (typeof career.roundIndex !== 'number' || career.roundIndex < 0 || career.roundIndex >= career.calendar.length) career.roundIndex = 0;
  if (typeof career.raceSequence !== 'number') career.raceSequence = 0;
  if (!Array.isArray(career.seasonHistory)) career.seasonHistory = [];
  if (!Array.isArray(career.log)) career.log = [];
  if (!career.driverStandings || typeof career.driverStandings !== 'object') career.driverStandings = {};
  if (!career.constructorStandings || typeof career.constructorStandings !== 'object') career.constructorStandings = {};
  Object.keys(career.teams).forEach(id => { if (career.constructorStandings[id] == null) career.constructorStandings[id] = 0; });
  Object.keys(career.driverPool).forEach(code => { if (career.driverStandings[code] == null) career.driverStandings[code] = 0; });
  return career;
}

function loadCareerFromStorage() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.career || !parsed.career.driverPool || !parsed.career.teams || !parsed.playerTeamId) return null;
    if (!parsed.career.teams[parsed.playerTeamId]) return null;
    parsed.career = repairLoadedCareer(parsed.career);
    return parsed;
  } catch (e) { return null; }
}

function clearCareerStorage() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

const SAVED_CAREER = loadCareerFromStorage();

let state = { ...initialState };
let autoplayTimer = null;

function dispatch(action) {
  if (action.type === 'RESET') clearCareerStorage();
  state = reducer(state, action);
  saveCareerToStorage(state);
  render();
}

function scheduleAutoplay() {
  clearTimeout(autoplayTimer);
  if (state.phase === 'race' && state.autoPlay) {
    const ms = state.speed === 4 ? 260 : state.speed === 2 ? 600 : 1300;
    autoplayTimer = setTimeout(() => dispatch({ type: 'TICK' }), ms);
  }
}

function currentThemeTeam(s) {
  if (!s.playerTeamId) return null;
  if (s.mode === 'career' && s.career && s.career.teams) return s.career.teams[s.playerTeamId] || null;
  if (s.mode === 'quick') return TEAMS.find(t => t.id === s.playerTeamId) || null;
  return null;
}

function applyTeamTheme(s) {
  try {
    const team = currentThemeTeam(s);
    const root = document.documentElement;
    if (!team) {
      root.style.setProperty('--tp', '#FFB020');
      root.style.setProperty('--ts', '#4FD1E8');
      root.style.setProperty('--ttext', '#0B0E14');
      return;
    }
    root.style.setProperty('--tp', team.color || '#FFB020');
    root.style.setProperty('--ts', team.secondary || '#4FD1E8');
    root.style.setProperty('--ttext', team.textOnPrimary || '#0B0E14');
  } catch (e) { /* theming is cosmetic only — never let it break the app */ }
}

function render() {
  const root = document.getElementById('root');
  applyTeamTheme(state);
  const timingEl = document.getElementById('timing-tower-scroll');
  const timingScroll = timingEl ? timingEl.scrollTop : null;
  const eventEl = document.getElementById('event-terminal-scroll');
  const eventWasAtBottom = eventEl ? (eventEl.scrollHeight - eventEl.scrollTop - eventEl.clientHeight < 20) : true;
  const eventScroll = eventEl ? eventEl.scrollTop : null;
  const gapDetailsEl = document.getElementById('gap-details');
  const gapOpen = gapDetailsEl ? gapDetailsEl.open : false;
  const eventDetailsEl = document.getElementById('event-details');
  const eventOpen = eventDetailsEl ? eventDetailsEl.open : false;
  const screenEl = document.getElementById('screen-scroll');
  const screenScroll = screenEl ? screenEl.scrollTop : null;

  root.innerHTML = renderApp(state);

  const newTimingEl = document.getElementById('timing-tower-scroll');
  if (newTimingEl && timingScroll != null) newTimingEl.scrollTop = timingScroll;
  const newEventEl = document.getElementById('event-terminal-scroll');
  if (newEventEl) newEventEl.scrollTop = eventWasAtBottom ? newEventEl.scrollHeight : (eventScroll != null ? eventScroll : newEventEl.scrollHeight);
  const newGapDetailsEl = document.getElementById('gap-details');
  if (newGapDetailsEl) newGapDetailsEl.open = gapOpen;
  const newEventDetailsEl = document.getElementById('event-details');
  if (newEventDetailsEl) newEventDetailsEl.open = eventOpen;
  const newScreenEl = document.getElementById('screen-scroll');
  if (newScreenEl && screenScroll != null) newScreenEl.scrollTop = screenScroll;

  scheduleAutoplay();
}

document.getElementById('root').addEventListener('click', (e) => {
  const nameBtn = e.target.closest('[data-name-confirm]');
  if (nameBtn) {
    const input = document.getElementById('manager-name-input');
    dispatch({ type: 'SET_MANAGER_NAME', name: input ? input.value : '' });
    return;
  }
  const talkBtn = e.target.closest('[data-talk-code]');
  if (talkBtn) {
    dispatch({ type: 'TALK_TO_DRIVER', code: talkBtn.getAttribute('data-talk-code') });
    return;
  }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = JSON.parse(btn.getAttribute('data-action'));
  dispatch(action);
});

document.getElementById('root').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target && e.target.id === 'manager-name-input') {
    dispatch({ type: 'SET_MANAGER_NAME', name: e.target.value });
  }
});

document.getElementById('root').addEventListener('change', (e) => {
  const input = e.target.closest('[data-dev-input]');
  if (!input) return;
  const category = input.getAttribute('data-dev-input');
  const thousands = Number(input.value);
  if (Number.isNaN(thousands)) return;
  dispatch({ type: 'SET_DEV_INVEST_EXACT', category, value: thousands / 1000 });
});

render();
</script></body></html>
