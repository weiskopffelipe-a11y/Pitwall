let uidCounter = 0;
function nextUid() { return `evt-${Date.now()}-${uidCounter++}`; }
function mkEvent(lap, text, type) { return { id: nextUid(), lap, text, type }; }

function gauss() {
  let s = 0;
  for (let i = 0; i < 3; i++) s += Math.random();
  return (s / 3 - 0.5) * 2;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function fmtGap(sec) {
  if (sec == null) return '—';
  if (sec <= 0.0001) return 'LÍDER';
  return `+${sec.toFixed(1)}s`;
}
function fmtLapTime(sec) {
  if (sec == null) return '—';
  const m = Math.floor(sec / 60);
  const s = (sec - m * 60).toFixed(3);
  return `${m}:${s.padStart(6, '0')}`;
}
function fmtMoney(v) {
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 1) {
    const val = abs < 10 ? (Math.round(abs * 100) / 100) : Math.round(abs);
    return `${sign}$${val}M`;
  }
  return `${sign}$${Math.round(abs * 1000)}K`;
}

function paceTier(p) {
  if (p >= 90) return { label: 'Favorito ao título', tone: 'text-amber-400' };
  if (p >= 83) return { label: 'Meio-campo forte', tone: 'text-cyan-300' };
  if (p >= 76) return { label: 'Meio-campo', tone: 'text-slate-300' };
  return { label: 'Equipe em reconstrução', tone: 'text-slate-400' };
}
function weatherLabel(cond) {
  if (cond === 'dry') return 'Seco';
  if (cond === 'light_rain') return 'Chuva fraca';
  return 'Chuva forte';
}
function weatherChangeMessage(cond) {
  if (cond === 'light_rain') return '🌧 Começa a chover! Pista ficando escorregadia.';
  if (cond === 'heavy_rain') return '⛈ Chuva forte agora! Risco real de aquaplanagem.';
  return '☀️ A chuva passou, a pista começa a secar.';
}
function flagLabel(f) {
  return { green: 'PISTA LIVRE', sc: 'SAFETY CAR', vsc: 'VSC', checkered: 'BANDEIRADA' }[f] || f;
}
function pickMechFailure(devLevels) {
  const weak = weakestDevCategory(devLevels);
  if (weak) {
    const byCat = {
      gearbox: 'falha na caixa de câmbio', brakes: 'falha nos freios',
      electrical: 'pane elétrica', reliability: 'falha mecânica generalizada',
    };
    if (byCat[weak] && Math.random() < 0.65) return byCat[weak];
  }
  return pick(MECH_FAILURES);
}
function pickIncidentFlavor(weather) { return pick(weather.condition === 'dry' ? INCIDENT_DRY : INCIDENT_WET); }
function roleLabel(r) { return { race1: 'Titular 1', race2: 'Titular 2', reserve: 'Reserva/Testes' }[r] || r; }

/* ==================================================================
   Grade de pilotos ativa (usada tanto na corrida rápida quanto na carreira)
================================================================== */

function activeRaceDrivers(team) {
  // os dois titulares correm; o reserva só entra se um titular estiver ausente (não usado no MVP, mas a função fica pronta)
  return team.drivers.filter(d => d.role === 'race1' || d.role === 'race2');
}

function buildGrid(teamsList, playerTeamId, circuit, weatherStart) {
  const startCompound = weatherStart === 'dry' ? 'medium' : 'inter';
  const cars = [];
  teamsList.forEach(team => {
    activeRaceDrivers(team).forEach(d => {
      cars.push({
        id: `${team.id}-${d.code}`,
        code: d.code,
        name: d.name,
        teamId: team.id,
        teamShort: team.short,
        color: team.color,
        carPace: team.carPace + (team.carPaceBonus || 0),
        reliability: team.reliability + (team.reliabilityBonus || 0),
        teamDevLevels: team.devLevels || null,
        experience: d.experience, carFeel: d.carFeel, wet: d.wet, overtaking: d.overtaking,
        starts: d.starts, focus: d.focus, physical: d.physical, pace: d.pace,
        isPlayer: team.id === playerTeamId,
        position: 0, gridPosition: 0, raceTime: 0, gapToLeader: 0, lastLapDelta: 0,
        compound: startCompound, tyreWear: 0, tyreLaps: 0, pitStops: 0, overLimitLaps: 0,
        compoundsUsed: [startCompound], paceMode: 'balanced', pendingPit: null,
        dnf: false, dnfLap: null, dnfReason: null, bestLap: null,
      });
    });
  });
  return cars;
}

function runQualifying(teamsList, circuit) {
  const scored = [];
  teamsList.forEach(team => {
    activeRaceDrivers(team).forEach(d => {
      const effectiveCarPace = (team.carPace + (team.carPaceBonus || 0)) * (0.94 + d.carFeel * 0.006);
      const base = effectiveCarPace * 0.55 + d.pace * 10 * 0.45;
      const noise = (Math.random() - 0.5) * 10;
      scored.push({ teamId: team.id, code: d.code, name: d.name, color: team.color, score: base + noise });
    });
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.map((s, i) => ({ ...s, grid: i + 1 }));
}

function evolveWeather(weather, circuit) {
  const r = Math.random() * 100;
  const changeChance = circuit.rain * 0.06;
  if (r > changeChance) return weather;
  if (weather.condition === 'dry') return { condition: 'light_rain' };
  if (weather.condition === 'light_rain') return Math.random() < 0.4 ? { condition: 'heavy_rain' } : { condition: 'dry' };
  if (weather.condition === 'heavy_rain') return { condition: 'light_rain' };
  return weather;
}

function weatherPenaltyFor(car, weather) {
  const compoundDef = COMPOUNDS[car.compound];
  const wet = weather.condition !== 'dry';
  const intensity = weather.condition === 'heavy_rain' ? 1 : weather.condition === 'light_rain' ? 0.5 : 0;
  if (wet && !compoundDef.wetOk) return 3.0 * intensity + 1.5;
  if (!wet && compoundDef.wetOk) return 2.2;
  if (wet && compoundDef.wetOk) {
    if (car.compound === 'inter' && weather.condition === 'heavy_rain') return 1.4;
    if (car.compound === 'wet' && weather.condition === 'light_rain') return 0.6;
    return 0;
  }
  return 0;
}

function rollIncident(car, weather, flag) {
  if (flag !== 'green') return null;
  const paceDef = PACE_MODES[car.paceMode];
  const wet = weather.condition !== 'dry';
  const wrongTyre = wet && !COMPOUNDS[car.compound].wetOk;
  let risk = ((10 - car.focus) / 10) * 0.014;
  risk *= paceDef.riskMult;
  risk *= (1 - car.experience * 0.018);
  if (wrongTyre) risk *= 3.2;
  if (car.tyreWear > 85) risk *= 1.6;
  if (wet && !wrongTyre) risk *= clamp(1.35 - car.wet * 0.045, 0.7, 1.4);
  const roll = Math.random();
  if (roll < risk * 0.18) return 'major';
  if (roll < risk) return 'minor';
  return null;
}

function rollMechanicalDNF(car) {
  const chance = ((100 - car.reliability) / 100) * 0.0016;
  return Math.random() < chance;
}

function aiDecide(car, weather, lap, totalLaps) {
  let c = car;
  const wet = weather.condition !== 'dry';
  const compoundDef = COMPOUNDS[c.compound];
  const lapsLeft = totalLaps - lap;

  if (!c.pendingPit) {
    if (wet && !compoundDef.wetOk) {
      if (Math.random() < 0.6) c = { ...c, pendingPit: weather.condition === 'heavy_rain' ? 'wet' : 'inter' };
    } else if (!wet && compoundDef.wetOk && c.tyreLaps > 1) {
      if (Math.random() < 0.5) c = { ...c, pendingPit: lapsLeft > 15 ? 'medium' : 'soft' };
    } else if (!wet) {
      const threshold = 78 + Math.random() * 14;
      if (c.tyreWear > threshold && lapsLeft > 3) {
        const compound = lapsLeft > 18 ? (Math.random() < 0.5 ? 'medium' : 'hard') : 'soft';
        c = { ...c, pendingPit: compound };
      }
    }
  }

  let mode = 'balanced';
  if (c.tyreWear > 90) mode = 'save';
  else if (lapsLeft < 6) mode = 'push';
  else if (Math.random() < 0.05) mode = Math.random() < 0.5 ? 'push' : 'save';
  c = { ...c, paceMode: mode };
  return c;
}

function applyTrafficModel(running, circuit) {
  const diffMap = { 'muito baixa': 0.85, 'baixa': 0.55, 'média': 0.3, 'alta': 0.1 };
  const diffPenalty = diffMap[circuit.overtaking] != null ? diffMap[circuit.overtaking] : 0.3;
  for (let i = 1; i < running.length; i++) {
    const atk = running[i], def = running[i - 1];
    const gap = atk.raceTime - def.raceTime;
    if (gap > 0 && gap < 0.8) {
      const skillEdge = (atk.overtaking - def.overtaking) * 0.04;
      const passChance = clamp(0.55 + skillEdge - diffPenalty, 0.05, 0.92);
      if (Math.random() > passChance) {
        atk.raceTime = def.raceTime + 0.12 + Math.random() * 0.35;
      }
    }
  }
  running.sort((a, b) => a.raceTime - b.raceTime);
  return running;
}

function simulateLap(state) {
  const { grid, circuit, weather, lap, flag, flagLapsRemaining, prevPositions, totalLaps } = state;
  const events = [];
  if (lap === 1) events.push(mkEvent(1, 'Largada! As luzes se apagam.', 'info'));

  const newWeather = evolveWeather(weather, circuit);
  if (newWeather.condition !== weather.condition) events.push(mkEvent(lap, weatherChangeMessage(newWeather.condition), 'weather'));

  let newFlag = flag;
  let newFlagLapsRemaining = flagLapsRemaining;
  if (newFlag === 'sc' || newFlag === 'vsc') {
    newFlagLapsRemaining -= 1;
    if (newFlagLapsRemaining <= 0) {
      events.push(mkEvent(lap, newFlag === 'sc' ? 'Safety Car recolhe. Corrida reiniciada!' : 'VSC encerrado.', 'flag'));
      newFlag = 'green';
    }
  }

  let cautionTriggered = false;
  const lapsRemaining = totalLaps - lap;

  const updatedCars = grid.map(carIn => {
    if (carIn.dnf) return carIn;
    let c = carIn.isPlayer ? { ...carIn } : aiDecide({ ...carIn }, newWeather, lap, totalLaps);

    let pitLoss = 0, pitted = false;
    if (c.pendingPit) {
      pitLoss = (newFlag === 'sc' || newFlag === 'vsc') ? 13 : 23;
      c.compound = c.pendingPit; c.tyreWear = 0; c.tyreLaps = 0; c.pitStops += 1;
      if (!c.compoundsUsed.includes(c.pendingPit)) c.compoundsUsed = [...c.compoundsUsed, c.pendingPit];
      c.pendingPit = null; pitted = true;
    }

    if (!pitted && rollMechanicalDNF(c)) {
      c.dnf = true; c.dnfLap = lap; c.dnfReason = pickMechFailure(c.teamDevLevels);
      events.push(mkEvent(lap, `ABANDONO: ${c.name} para na pista (${c.dnfReason}).`, 'dnf'));
      if (newFlag === 'green' && !cautionTriggered && Math.random() < 0.35) {
        newFlag = 'vsc'; newFlagLapsRemaining = 2 + Math.floor(Math.random() * 2);
        events.push(mkEvent(lap, 'VIRTUAL SAFETY CAR acionado.', 'flag')); cautionTriggered = true;
      }
      return c;
    }

    if (!pitted && c.tyreWear >= 100) {
      c.overLimitLaps = (c.overLimitLaps || 0) + 1;
      const blowoutChance = 0.05 + c.overLimitLaps * 0.045;
      if (Math.random() < blowoutChance) {
        c.dnf = true; c.dnfLap = lap; c.dnfReason = 'pneu estourou';
        events.push(mkEvent(lap, `💥 PNEU: ${c.name} teve o pneu estourado e abandona!`, 'dnf'));
        if (newFlag === 'green' && !cautionTriggered && Math.random() < 0.5) {
          newFlag = 'vsc'; newFlagLapsRemaining = 2 + Math.floor(Math.random() * 2);
          events.push(mkEvent(lap, 'VIRTUAL SAFETY CAR acionado.', 'flag')); cautionTriggered = true;
        }
        return c;
      }
    } else if (!pitted) {
      c.overLimitLaps = 0;
    }

    let incidentExtra = 0;
    if (!pitted) {
      const inc = rollIncident(c, newWeather, newFlag);
      if (inc === 'major') {
        c.dnf = true; c.dnfLap = lap; c.dnfReason = pickIncidentFlavor(newWeather);
        events.push(mkEvent(lap, `ACIDENTE: ${c.name} ${c.dnfReason}.`, 'dnf'));
        if (newFlag === 'green' && !cautionTriggered) {
          const r = Math.random();
          if (r < 0.55) { newFlag = 'sc'; newFlagLapsRemaining = 4 + Math.floor(Math.random() * 3); events.push(mkEvent(lap, 'SAFETY CAR na pista!', 'flag')); }
          else if (r < 0.85) { newFlag = 'vsc'; newFlagLapsRemaining = 2 + Math.floor(Math.random() * 2); events.push(mkEvent(lap, 'VIRTUAL SAFETY CAR acionado.', 'flag')); }
          cautionTriggered = true;
        }
        return c;
      } else if (inc === 'minor') {
        incidentExtra = 0.8 + Math.random() * 2.2;
        events.push(mkEvent(lap, `${c.name} escorrega e perde tempo.`, 'minor'));
      }
    }

    const compoundDef = COMPOUNDS[c.compound];
    const carFeelFactor = 0.94 + c.carFeel * 0.006;
    const effectiveCarPace = c.carPace * carFeelFactor;
    const carDeficit = (100 - effectiveCarPace) * 0.045;
    const driverDeficit = (10 - c.pace) * 0.28;
    const tyreMgmtFactor = 1 - (c.focus - 7) * 0.025;
    const wearShape = c.compound === 'soft' ? 1.15 : c.compound === 'medium' ? 1.0 : c.compound === 'hard' ? 0.85 : 1.0;
    const wearPenalty = (c.tyreWear / 100) * wearShape * 1.4 * tyreMgmtFactor;
    const wPenalty = weatherPenaltyFor(c, newWeather);
    const wetSkillBonus = newWeather.condition !== 'dry' ? (c.wet - 6.5) * 0.12 : 0;
    const paceDef = PACE_MODES[c.paceMode];
    const noise = gauss() * (0.6 - c.focus * 0.045);

    let startBonus = 0;
    if (lap === 1) startBonus = (c.starts - 6) * 0.08 + (c.experience - 6) * 0.02;
    let fatiguePenalty = 0;
    if (lapsRemaining < totalLaps * 0.2 && totalLaps > 20) fatiguePenalty = Math.max(0, (7 - c.physical) * 0.015);

    let lapTime;
    if (newFlag === 'sc' || newFlag === 'vsc') {
      lapTime = circuit.baseLap * (newFlag === 'sc' ? 1.62 : 1.38) + gauss() * 0.3;
    } else {
      lapTime = circuit.baseLap + carDeficit + driverDeficit + compoundDef.grip + wearPenalty + wPenalty - wetSkillBonus + paceDef.delta + noise + incidentExtra - startBonus + fatiguePenalty;
    }
    lapTime += pitLoss;
    if (lapTime < circuit.baseLap * 0.6) lapTime = circuit.baseLap * 0.6;

    c.lastLapDelta = lapTime - circuit.baseLap;
    c.raceTime = c.raceTime + lapTime;
    if (c.bestLap == null || lapTime < c.bestLap) c.bestLap = lapTime;

    const cautionFactor = (newFlag === 'sc' || newFlag === 'vsc') ? 0.2 : 1;
    let wearGainMult = 1;
    const wetNow = newWeather.condition !== 'dry';
    if (wetNow && !compoundDef.wetOk) wearGainMult = 1.7;
    if (!wetNow && compoundDef.wetOk) wearGainMult = 1.9;
    c.tyreWear = Math.min(100, c.tyreWear + compoundDef.wearRate * paceDef.wearMult * cautionFactor * wearGainMult * tyreMgmtFactor);
    c.tyreLaps += 1;

    if (pitted) events.push(mkEvent(lap, `${c.name} vai aos boxes: pneu ${compoundDef.label.toLowerCase()} novo.`, c.isPlayer ? 'pit-player' : 'pit'));
    return c;
  });

  let running = updatedCars.filter(c => !c.dnf).sort((a, b) => a.raceTime - b.raceTime);
  running = applyTrafficModel(running, circuit);
  const retired = updatedCars.filter(c => c.dnf).sort((a, b) => b.dnfLap - a.dnfLap);
  const ordered = [...running, ...retired];
  const leaderTime = running.length ? running[0].raceTime : 0;

  const newPrevPositions = {};
  const finalCars = ordered.map((c, i) => {
    const pos = i + 1;
    newPrevPositions[c.id] = pos;
    return { ...c, position: pos, gapToLeader: c.dnf ? null : c.raceTime - leaderTime };
  });

  finalCars.forEach(c => {
    const prev = prevPositions[c.id];
    if (prev == null || c.dnf) return;
    if (c.isPlayer && c.position < prev) events.push(mkEvent(lap, `🔺 ${c.name} sobe para P${c.position}.`, 'pos-player'));
    else if (c.isPlayer && c.position > prev) events.push(mkEvent(lap, `🔻 ${c.name} cai para P${c.position}.`, 'pos-player'));
    else if (!c.isPlayer && c.position <= 3 && c.position < prev) events.push(mkEvent(lap, `${c.name} assume a P${c.position}.`, 'pos'));
  });

  const pauseWorthy = events.some(e => ['weather', 'flag', 'dnf', 'pit-player'].includes(e.type));
  return { finalCars, newWeather, newFlag, newFlagLapsRemaining, events, newPrevPositions, pauseWorthy };
}

function buildHistoryPoint(lap, cars, playerCarIds) {
  const [idA, idB] = playerCarIds;
  const carA = cars.find(c => c.id === idA);
  const carB = cars.find(c => c.id === idB);
  return {
    lap,
    a: carA && !carA.dnf ? Number(carA.gapToLeader.toFixed(2)) : null,
    b: carB && !carB.dnf ? Number(carB.gapToLeader.toFixed(2)) : null,
  };
}


/* ==================================================================
   PITWALL MANAGER — modo carreira (parte 2/2)
================================================================== */

function estimateSalary(d) {
  const score = d.pace * 0.5 + d.experience * 0.25 + d.overtaking * 0.25;
  const a = SALARY_ANCHORS;
  if (score <= a[0][0]) return a[0][1];
  if (score >= a[a.length - 1][0]) return a[a.length - 1][1];
  for (let i = 0; i < a.length - 1; i++) {
    const [s0, v0] = a[i], [s1, v1] = a[i + 1];
    if (score >= s0 && score <= s1) {
      const t = (score - s0) / (s1 - s0);
      return Math.round((v0 + t * (v1 - v0)) * 100) / 100;
    }
  }
  return a[0][1];
}

function driverInterest(driver, team, career) {
  if (driver.teamId === team.id) return 1;
  if (!driver.teamId) return 0.9;
  const currentTeam = career.teams[driver.teamId];
  const offerPrestige = clamp((effectivePaceReliability(team).carPace - 74) / (97 - 74), 0, 1);
  const currentPrestige = currentTeam ? clamp((effectivePaceReliability(currentTeam).carPace - 74) / (97 - 74), 0, 1) : 0.5;
  let interest = 0.32 + (offerPrestige - currentPrestige) * 0.55;
  interest -= Math.max(0, driver.contractYears - 1) * 0.1;
  return clamp(interest, 0.06, 0.85);
}

function negotiateContract(driver, team, career, offerSalary, offerYears) {
  if (driver.cooldownUntilRaceSeq && career.raceSequence < driver.cooldownUntilRaceSeq) {
    return { accepted: false, cooldown: true, message: `${driver.name} pediu um tempo — só volte a propor após a próxima corrida.` };
  }
  const isOwnTeam = driver.teamId === team.id;
  if (!isOwnTeam) {
    const interest = driverInterest(driver, team, career);
    if (Math.random() > interest) {
      const rivalName = (driver.teamId && career.teams[driver.teamId] && career.teams[driver.teamId].name) || null;
      return { accepted: false, notInterested: true, message: `${driver.name} não demonstrou interesse em sair${rivalName ? ' de ' + rivalName : ''} agora.` };
    }
  }
  const base = estimateSalary(driver);
  const prestige = clamp((effectivePaceReliability(team).carPace - 74) / (97 - 74), 0, 1);
  let expected = base * (1.3 - prestige * 0.3);
  if (driver.pace >= 8 && prestige < 0.4) expected *= 1.15;
  if (driver.teamId && !isOwnTeam) expected *= 1.1;
  if (!offerYears || offerYears < 1) return { accepted: false, counterOffer: Math.round(expected * 10) / 10 };
  const satisfaction = offerSalary / Math.max(0.1, expected);
  if (satisfaction >= 1.1) return { accepted: true };
  if (satisfaction >= 0.9 && Math.random() < 0.45) return { accepted: true };
  const counter = Math.round(expected * (1.0 + Math.random() * 0.15) * 10) / 10;
  return { accepted: false, counterOffer: counter };
}

function generateRookie(teamId, driverPool) {
  const first = pick(NAME_POOL_FIRST);
  const last = pick(NAME_POOL_LAST);
  let code = last.slice(0, 3).toUpperCase().replace(/[^A-Z]/g, 'X');
  while (driverPool && driverPool[code]) code = code.slice(0, 2) + String(randInt(0, 9));
  return {
    code, name: `${first} ${last}`, age: randInt(18, 21), teamId, role: null, retired: false,
    experience: 1, carFeel: randInt(4, 6), wet: randInt(4, 6), overtaking: randInt(4, 6),
    starts: randInt(3, 5), focus: randInt(4, 6), physical: randInt(6, 8), pace: randInt(5, 7),
    contractYears: randInt(2, 3),
  };
}

function buildCalendarForYear(year) {
  return CIRCUITS.map(c => c.id);
}

function activeCareerRaceDrivers(team) {
  return (team.drivers || []).filter(d => d.role === 'race1' || d.role === 'race2');
}

function initDevLevels(carPace) {
  const base = clamp(40 + (carPace - 70) * 1.8, 35, 85);
  const levels = {}; const invest = {}; const start = {};
  const tier = carPace >= 90 ? 'good' : carPace >= 78 ? 'mid' : 'poor';
  const investRange = tier === 'good' ? [0.29, 0.40] : tier === 'mid' ? [0.25, 0.29] : [0.10, 0.25];
  UPGRADE_CATEGORIES.forEach(c => {
    const v = clamp(base + (Math.random() * 10 - 5), 30, 92);
    levels[c.id] = v; start[c.id] = v;
    invest[c.id] = Math.round((investRange[0] + Math.random() * (investRange[1] - investRange[0])) * 1000) / 1000;
  });
  return { devLevels: levels, devLevelsStart: start, devInvest: invest };
}

function effectivePaceReliability(team) {
  const dl = team.devLevels || {};
  const dlStart = team.devLevelsStart || dl;
  let paceDelta = 0, relDelta = 0;
  UPGRADE_CATEGORIES.forEach(c => {
    const lvl = dl[c.id] != null ? dl[c.id] : DEV_BASELINE;
    const startLvl = dlStart[c.id] != null ? dlStart[c.id] : lvl;
    paceDelta += (lvl - startLvl) * c.paceW;
    relDelta += (lvl - startLvl) * c.relW;
  });
  return {
    carPace: team.basePace + paceDelta * 0.22,
    reliability: clamp(team.baseReliability + relDelta * 0.22, 40, 99),
  };
}

function weakestDevCategory(devLevels) {
  if (!devLevels) return null;
  const relevant = ['gearbox', 'brakes', 'electrical', 'reliability'];
  let worst = relevant[0], worstVal = 999;
  relevant.forEach(id => { const v = devLevels[id] != null ? devLevels[id] : DEV_BASELINE; if (v < worstVal) { worstVal = v; worst = id; } });
  return worst;
}

function deriveTeamsListFromCareer(career) {
  return Object.values(career.teams).map(t => {
    const eff = effectivePaceReliability(t);
    return {
      id: t.id, name: t.name, short: t.short, color: t.color,
      carPace: eff.carPace, reliability: eff.reliability,
      carPaceBonus: 0, reliabilityBonus: 0, devLevels: t.devLevels,
      drivers: (t.driverCodes || []).map(code => career.driverPool[code]).filter(d => d && !d.retired),
    };
  });
}

function initCareerState(playerTeamId) {
  const teams = {};
  const driverPool = {};
  TEAMS.forEach(team => {
    const budget = 30;
    const supplier = ENGINE_SUPPLIERS.find(e => e.name === team.engine);
    const dev = initDevLevels(team.carPace);
    teams[team.id] = {
      id: team.id, name: team.name, short: team.short, color: team.color,
      basePace: team.carPace, baseReliability: team.reliability,
      devLevels: dev.devLevels, devLevelsStart: dev.devLevelsStart, devInvest: dev.devInvest,
      budget, sponsorDeals: [], engineSupplierId: supplier ? supplier.id : 'mercedes',
      engineContractYears: randInt(1, 3),
      driverCodes: team.drivers.map(d => d.code),
    };
    team.drivers.forEach(d => {
      driverPool[d.code] = { ...d, teamId: team.id, retired: false, salary: estimateSalary(d), contractYears: randInt(1, 3) };
    });
  });
  F2_FREE_AGENTS.forEach(d => {
    driverPool[d.code] = { ...d, teamId: null, role: null, retired: false, salary: estimateSalary(d), contractYears: 0, cooldownUntilRaceSeq: 0 };
  });
  Object.keys(driverPool).forEach(code => { if (driverPool[code].cooldownUntilRaceSeq == null) driverPool[code].cooldownUntilRaceSeq = 0; });

  const driverStandings = {}; const constructorStandings = {};
  Object.keys(driverPool).forEach(code => { driverStandings[code] = 0; });
  Object.keys(teams).forEach(id => { constructorStandings[id] = 0; });

  return {
    year: 2026, playerTeamId, teams, driverPool, driverStandings, constructorStandings,
    calendar: buildCalendarForYear(2026), roundIndex: 0, seasonHistory: [], raceSequence: 0,
    log: ['Bem-vindo à Pitwall Manager! Temporada 2026 pronta para começar.'],
  };
}

function applyCareerRaceResults(career, finalCars) {
  const newDriverStandings = { ...career.driverStandings };
  const newConstructorStandings = { ...career.constructorStandings };
  const pointsAwarded = {};
  const fastestCar = finalCars.reduce((best, c) => (c.bestLap && (!best || c.bestLap < best.bestLap) ? c : best), null);
  finalCars.forEach(c => {
    if (c.dnf) return;
    let pts = POINTS[c.position - 1] || 0;
    if (fastestCar && fastestCar.id === c.id && c.position <= 10) pts += 1;
    if (pts > 0) {
      newDriverStandings[c.code] = (newDriverStandings[c.code] || 0) + pts;
      newConstructorStandings[c.teamId] = (newConstructorStandings[c.teamId] || 0) + pts;
      pointsAwarded[c.code] = pts;
    }
  });
  return { newDriverStandings, newConstructorStandings, pointsAwarded };
}

function processOffseason(career) {
  const teams = {};
  Object.entries(career.teams).forEach(([id, t]) => { teams[id] = { ...t, sponsorDeals: [...(t.sponsorDeals || [])], driverCodes: [...t.driverCodes] }; });
  const driverPool = {};
  Object.entries(career.driverPool).forEach(([code, d]) => { driverPool[code] = { ...d }; });
  const log = [];

  const standingsOrder = Object.entries(career.constructorStandings).sort((a, b) => b[1] - a[1]).map(([id]) => id);
  standingsOrder.forEach((id, idx) => {
    if (!teams[id]) return;
    const pos = idx + 1;
    if (id === career.playerTeamId) log.push(`Fim de temporada ${career.year}: P${pos} no campeonato de construtores.`);
  });

  const openSeats = [];
  Object.values(driverPool).forEach(d => {
    if (d.retired) return;
    d.age += 1;
    let retireChance = 0;
    if (d.age >= 42) retireChance = 0.55;
    else if (d.age >= 39) retireChance = 0.22;
    else if (d.age >= 36) retireChance = 0.07;
    else if (d.age >= 33) retireChance = 0.02;
    if (Math.random() < retireChance) {
      d.retired = true;
      log.push(`${d.name} anuncia aposentadoria aos ${d.age} anos.`);
      openSeats.push({ teamId: d.teamId, role: d.role, fromCode: d.code });
    }
  });

  Object.values(driverPool).forEach(d => {
    if (d.retired || !d.teamId) return;
    d.contractYears -= 1;
    if (d.contractYears <= 0) {
      const renewChance = clamp(0.55 + (d.pace - 6) * 0.09, 0.2, 0.95);
      if (Math.random() < renewChance) {
        d.contractYears = randInt(1, 3);
      } else {
        openSeats.push({ teamId: d.teamId, role: d.role, fromCode: d.code });
        log.push(`${d.name} deixa a equipe como agente livre.`);
        d.teamId = null; d.role = null;
      }
    }
  });

  let freeAgents = Object.values(driverPool).filter(d => !d.retired && !d.teamId);
  const seatsToFill = openSeats;
  seatsToFill.sort((a, b) => {
    const rp = (r) => (r === 'reserve' ? 0 : 1);
    const rd = rp(b.role) - rp(a.role);
    if (rd !== 0) return rd;
    const pa = (teams[a.teamId] ? effectivePaceReliability(teams[a.teamId]).carPace : 0);
    const pb = (teams[b.teamId] ? effectivePaceReliability(teams[b.teamId]).carPace : 0);
    return pb - pa;
  });
  seatsToFill.forEach(seat => {
    if (!teams[seat.teamId]) return;
    freeAgents.sort((a, b) => b.pace - a.pace);
    let hire;
    if (freeAgents.length && Math.random() < 0.6) {
      hire = freeAgents.shift();
      log.push(`${hire.name} assina com ${teams[seat.teamId].short} (${roleLabel(seat.role)}).`);
    } else {
      hire = generateRookie(seat.teamId, driverPool);
      hire.salary = estimateSalary(hire);
      driverPool[hire.code] = hire;
      log.push(`Estreante ${hire.name} (${hire.age} anos) assina com ${teams[seat.teamId].short}.`);
    }
    hire.teamId = seat.teamId; hire.role = seat.role; hire.contractYears = randInt(1, 3);
  });

  // Recompute every team's roster from the authoritative source (each driver's own teamId/role) rather than
  // incrementally patching arrays above — avoids corruption when several seats open at the same team at once.
  Object.keys(teams).forEach(id => {
    teams[id].driverCodes = Object.values(driverPool)
      .filter(d => d.teamId === id && !d.retired)
      .sort((a, b) => (a.role === 'reserve') - (b.role === 'reserve'))
      .map(d => d.code);
  });

  Object.values(teams).forEach(t => {
    if (!t.devLevels) { const dev = initDevLevels(t.basePace); t.devLevels = dev.devLevels; t.devLevelsStart = dev.devLevelsStart; t.devInvest = dev.devInvest; }
    UPGRADE_CATEGORIES.forEach(c => {
      const aiInvestEquivalent = 1.5 + Math.random() * 2.5;
      const growth = aiInvestEquivalent * DEV_GROWTH_RATE * (1 - t.devLevels[c.id] / 100) + (Math.random() * 3 - 1.6);
      t.devLevels[c.id] = clamp(t.devLevels[c.id] + growth, 25, 99);
    });
    t.engineContractYears = Math.max(0, (t.engineContractYears || 1) - 1);
  });

  const newDriverStandings = {}; Object.values(driverPool).forEach(d => { if (!d.retired) newDriverStandings[d.code] = 0; });
  const newConstructorStandings = {}; Object.keys(teams).forEach(id => { newConstructorStandings[id] = 0; });

  const driverChampEntry = Object.entries(career.driverStandings).sort((a, b) => b[1] - a[1])[0];

  return {
    teams, driverPool, log, year: career.year + 1,
    calendar: buildCalendarForYear(career.year + 1), roundIndex: 0,
    driverStandings: newDriverStandings, constructorStandings: newConstructorStandings,
    seasonHistory: [...career.seasonHistory, {
      year: career.year,
      driverChampionCode: driverChampEntry ? driverChampEntry[0] : null,
      driverChampionPoints: driverChampEntry ? driverChampEntry[1] : 0,
      constructorChampionId: standingsOrder[0] || null,
      finalDriverStandings: career.driverStandings,
      finalConstructorStandings: career.constructorStandings,
    }],
  };
}

function ensureTwoRaceDrivers(teams, driverPool, excludeCode) {
  let dp = driverPool;
  Object.keys(teams).forEach(id => {
    const raceDrivers = Object.values(dp).filter(d => d.teamId === id && !d.retired && (d.role === 'race1' || d.role === 'race2'));
    const missingRoles = ['race1', 'race2'].filter(r => !raceDrivers.some(d => d.role === r));
    missingRoles.forEach(role => {
      const freeAgents = Object.values(dp).filter(d => !d.retired && !d.teamId && d.code !== excludeCode).sort((a, b) => b.pace - a.pace);
      let hire;
      if (freeAgents.length) {
        hire = freeAgents[0];
      } else {
        hire = generateRookie(id, dp);
        hire.salary = estimateSalary(hire);
      }
      dp = { ...dp, [hire.code]: { ...hire, teamId: id, role, contractYears: hire.contractYears || randInt(1, 3) } };
    });
  });
  let tm = teams;
  Object.keys(tm).forEach(id => {
    tm = { ...tm, [id]: { ...tm[id], driverCodes: Object.values(dp).filter(d => d.teamId === id && !d.retired).map(d => d.code) } };
  });
  return { teams: tm, driverPool: dp };
}

function upgradeCost(currentBonus) {
  return Math.round(15 * Math.pow(1.35, Math.max(0, currentBonus)));
}

function sponsorsCurrentlyActive(career) {
  const taken = new Set();
  Object.values(career.teams).forEach(t => (t.sponsorDeals || []).forEach(d => taken.add(d.sponsorId)));
  return taken;
}

function maybeGenerateSponsorOffer(career) {
  if (Math.random() > 0.32) return null;
  const taken = sponsorsCurrentlyActive(career);
  const pool = SPONSORS.filter(s => !taken.has(s.id));
  if (!pool.length) return null;
  const sponsor = pick(pool);
  const constructorRank = Object.entries(career.constructorStandings).sort((a, b) => b[1] - a[1]);
  const posIdx = constructorRank.findIndex(([id]) => id === career.playerTeamId);
  const posFactor = posIdx < 0 ? 0.6 : clamp(1.3 - posIdx * 0.06, 0.5, 1.3);
  const tierMult = { 'Título': 2.2, 'Principal': 1.4, 'Técnico': 1.0, 'Associado': 0.7 }[sponsor.tier] || 1;
  const raceCount = randInt(6, 22);
  const totalValue = Math.max(0.15, Math.round(sponsor.payout * tierMult * posFactor * (raceCount / 10) * 100) / 100);
  const hasWinBonus = Math.random() < 0.3;
  const winBonus = hasWinBonus ? Math.max(0.05, Math.round(totalValue * 0.08 * 100) / 100) : null;
  return { sponsorId: sponsor.id, raceCount, totalValue, winBonus };
}

function processSponsorDealsAfterRace(team, finalCars, playerTeamId) {
  const won = finalCars.some(c => c.teamId === playerTeamId && c.position === 1 && !c.dnf);
  const log = [];
  const deals = (team.sponsorDeals || []).map(d => ({ ...d })).filter(d => {
    const perRace = d.totalValue / d.raceCount;
    team.budget += perRace;
    d.racesRemaining -= 1;
    if (won && d.winBonus) {
      team.budget += d.winBonus;
      const sp = SPONSORS.find(s => s.id === d.sponsorId);
      log.push(`${sp ? sp.name : 'Patrocinador'} pagou bônus de vitória: +${fmtMoney(d.winBonus)}.`);
    }
    if (d.racesRemaining <= 0) {
      const sp = SPONSORS.find(s => s.id === d.sponsorId);
      log.push(`Contrato com ${sp ? sp.name : 'patrocinador'} chegou ao fim.`);
      return false;
    }
    return true;
  });
  return { deals, log };
}


/* ==================================================================
   Estado inicial / reducer completo (corrida rápida + carreira)
================================================================== */

const initialState = {
  phase: 'menu', mode: null, playerTeamId: null, circuit: null,
  weather: { condition: 'dry' }, grid: [], lap: 0, totalLaps: 0, flag: 'green', flagLapsRemaining: 0,
  raceWeatherStart: null, preRaceTireChoice: { race1: null, race2: null },
  eventLog: [], prevPositions: {}, autoPlay: false, speed: 1, qualiResult: [], history: [], playerCarIds: [],
  career: null, careerViewDriverCode: null, careerLastRaceApplied: null, pendingSponsorOffer: null,
  contractUI: { targetCode: null, salary: 0, years: 1, targetRole: null, lastCounter: null, lastMessage: null },
};

function currentTeamsList(state) {
  return state.mode === 'career' ? deriveTeamsListFromCareer(state.career) : TEAMS;
}

function reducer(state, action) {
  switch (action.type) {
    case 'LOAD_CAREER': {
      if (typeof SAVED_CAREER === 'undefined' || !SAVED_CAREER) return state;
      return { ...state, mode: 'career', playerTeamId: SAVED_CAREER.playerTeamId, career: SAVED_CAREER.career, phase: 'career-hub' };
    }
    case 'GOTO': return { ...state, phase: action.phase };
    case 'RESET': return { ...initialState };

    case 'SELECT_MODE':
      return { ...state, mode: action.mode, phase: action.mode === 'quick' ? 'team' : 'career-team' };

    // ---- corrida rápida ----
    case 'SELECT_TEAM':
      return { ...state, playerTeamId: action.teamId, phase: 'circuit' };
    case 'SELECT_CIRCUIT': {
      const circuit = CIRCUITS.find(c => c.id === action.circuitId);
      const qualiResult = runQualifying(TEAMS, circuit);
      const raceWeatherStart = { condition: Math.random() * 100 < circuit.rain * 0.35 ? 'light_rain' : 'dry' };
      return { ...state, circuit, qualiResult, raceWeatherStart, preRaceTireChoice: { race1: null, race2: null }, phase: 'quali' };
    }
    case 'BACK_TO_CIRCUIT':
      return { ...state, phase: 'circuit', grid: [], eventLog: [], history: [] };

    // ---- carreira ----
    case 'CAREER_SELECT_TEAM': {
      const career = initCareerState(action.teamId);
      return { ...state, mode: 'career', playerTeamId: action.teamId, career, phase: 'career-hub' };
    }
    case 'CAREER_GOTO':
      return { ...state, phase: 'career-' + action.screen, contractUI: { targetCode: null, salary: 0, years: 1, targetRole: null, lastCounter: null, lastMessage: null } };
    case 'CAREER_VIEW_DRIVER':
      return { ...state, careerViewDriverCode: action.code, phase: 'career-profile' };
    case 'CAREER_START_RACE': {
      const circuit = CIRCUITS.find(c => c.id === state.career.calendar[state.career.roundIndex]);
      const teamsList = deriveTeamsListFromCareer(state.career);
      const qualiResult = runQualifying(teamsList, circuit);
      const raceWeatherStart = { condition: Math.random() * 100 < circuit.rain * 0.35 ? 'light_rain' : 'dry' };
      return { ...state, circuit, qualiResult, raceWeatherStart, preRaceTireChoice: { race1: null, race2: null }, phase: 'quali' };
    }
    case 'CAREER_CONTINUE': {
      const career = state.career;
      if (career.roundIndex + 1 < career.calendar.length) {
        const advanced = { ...career, roundIndex: career.roundIndex + 1 };
        const offer = maybeGenerateSponsorOffer(advanced);
        if (offer) return { ...state, career: advanced, phase: 'career-sponsor-offer', pendingSponsorOffer: offer, careerLastRaceApplied: null };
        return { ...state, career: advanced, phase: 'career-hub', careerLastRaceApplied: null };
      }
      const off = processOffseason(career);
      return { ...state, career: { ...career, ...off }, phase: 'career-offseason', careerLastRaceApplied: null };
    }
    case 'CAREER_ACK_OFFSEASON':
      return { ...state, phase: 'career-hub' };

    case 'ACCEPT_SPONSOR_OFFER': {
      const career = state.career;
      const offer = state.pendingSponsorOffer;
      if (!offer) return { ...state, phase: 'career-hub' };
      const team = career.teams[state.playerTeamId];
      const deal = { sponsorId: offer.sponsorId, totalValue: offer.totalValue, raceCount: offer.raceCount, racesRemaining: offer.raceCount, winBonus: offer.winBonus };
      const teams = { ...career.teams, [state.playerTeamId]: { ...team, sponsorDeals: [...(team.sponsorDeals || []), deal] } };
      const sp = SPONSORS.find(s => s.id === offer.sponsorId);
      const log = [...career.log, `Novo patrocínio: ${sp ? sp.name : offer.sponsorId} — ${offer.raceCount} corridas, ${fmtMoney(offer.totalValue)}${offer.winBonus ? ` + bônus de ${fmtMoney(offer.winBonus)} por vitória` : ''}.`].slice(-40);
      return { ...state, career: { ...career, teams, log }, pendingSponsorOffer: null, phase: 'career-hub' };
    }
    case 'DECLINE_SPONSOR_OFFER':
      return { ...state, pendingSponsorOffer: null, phase: 'career-hub' };

    case 'CONTRACT_DRAFT_START': {
      const d = state.career.driverPool[action.code];
      if (!d) return state;
      const isOwnTeam = d.teamId === state.playerTeamId;
      return { ...state, contractUI: { targetCode: action.code, salary: d.salary || estimateSalary(d), years: d.contractYears > 0 ? d.contractYears : 2, targetRole: isOwnTeam ? d.role : (d.role || 'reserve'), lastCounter: null, lastMessage: null } };
    }
    case 'CONTRACT_DRAFT_SET_ROLE':
      return { ...state, contractUI: { ...(state.contractUI || {}), targetRole: action.role, lastCounter: null, lastMessage: null } };
    case 'CONTRACT_DRAFT_ADJUST': {
      const cur = state.contractUI || {};
      if (action.field === 'salary') {
        const salary = Math.round(clamp((cur.salary || 0) + action.delta, 0.02, 1.6) * 1000) / 1000;
        return { ...state, contractUI: { ...cur, salary, lastCounter: null } };
      }
      const years = clamp((cur.years || 1) + action.delta, 1, 3);
      return { ...state, contractUI: { ...cur, years, lastCounter: null } };
    }
    case 'PROPOSE_CONTRACT': {
      const career = state.career;
      const driver = career.driverPool[action.code];
      if (!driver) return state;
      const draft = state.contractUI || {};
      const salary = draft.salary || estimateSalary(driver);
      const years = draft.years || 2;
      const team = career.teams[state.playerTeamId];
      const result = negotiateContract(driver, team, career, salary, years);
      if (result.cooldown) {
        return { ...state, contractUI: { ...draft, targetCode: action.code, lastCounter: null, lastMessage: result.message } };
      }
      if (!result.accepted) {
        const driverPool = { ...career.driverPool, [action.code]: { ...driver, cooldownUntilRaceSeq: career.raceSequence + 1 } };
        const msg = result.notInterested ? result.message : `${driver.name} recusou. Contraproposta: ${fmtMoney(result.counterOffer)}/corrida.`;
        return { ...state, career: { ...career, driverPool }, contractUI: { ...draft, targetCode: action.code, lastCounter: result.counterOffer || null, lastMessage: msg } };
      }
      const targetRole = draft.targetRole || driver.role || 'reserve';
      const currentHolderCode = team.driverCodes.find(c => c !== action.code && career.driverPool[c] && career.driverPool[c].role === targetRole);
      let driverPool = { ...career.driverPool };
      if (currentHolderCode) driverPool[currentHolderCode] = { ...driverPool[currentHolderCode], teamId: null, role: null, contractYears: 0 };
      driverPool[action.code] = { ...driver, salary, contractYears: years, teamId: state.playerTeamId, role: targetRole, cooldownUntilRaceSeq: 0 };
      const safe = ensureTwoRaceDrivers(career.teams, driverPool, action.code);
      const teams = { ...safe.teams, [state.playerTeamId]: { ...safe.teams[state.playerTeamId], driverCodes: Object.values(safe.driverPool).filter(d => d.teamId === state.playerTeamId && !d.retired).map(d => d.code) } };
      const log = currentHolderCode
        ? [...career.log, `${driver.name} assina com a equipe (${roleLabel(targetRole)}). ${driverPool[currentHolderCode].name} fica livre no mercado.`].slice(-40)
        : [...career.log, `${driver.name} assina com a equipe (${roleLabel(targetRole)}).`].slice(-40);
      return { ...state, career: { ...career, driverPool: safe.driverPool, teams, log }, contractUI: { targetCode: action.code, salary, years, targetRole, lastCounter: null, lastMessage: `${driver.name} aceitou: ${fmtMoney(salary)}/corrida, contrato de ${years} ano(s).` } };
    }

    case 'ADJUST_DEV_INVEST': {
      const career = state.career;
      const team = career.teams[state.playerTeamId];
      const current = (team.devInvest && team.devInvest[action.category]) || 0;
      const next = Math.round(clamp(current + action.delta, 0, 0.999) * 1000) / 1000;
      const teams = { ...career.teams, [state.playerTeamId]: { ...team, devInvest: { ...team.devInvest, [action.category]: next } } };
      return { ...state, career: { ...career, teams } };
    }

    case 'SET_ENGINE_SUPPLIER': {
      const career = state.career;
      const team = career.teams[state.playerTeamId];
      const switchCost = team.engineSupplierId === action.supplierId ? 0 : 10;
      if (team.budget < switchCost) return state;
      const teams = { ...career.teams, [state.playerTeamId]: { ...team, budget: team.budget - switchCost, engineSupplierId: action.supplierId, engineContractYears: 3 } };
      return { ...state, career: { ...career, teams } };
    }

    // ---- simulação (compartilhada corrida rápida / carreira) ----
    case 'SET_PRERACE_TIRE':
      return { ...state, preRaceTireChoice: { ...(state.preRaceTireChoice || {}), [action.role]: action.compound } };
    case 'START_RACE': {
      const teamsList = currentTeamsList(state);
      const circuit = state.circuit;
      const playerTeamObj = teamsList.find(t => t.id === state.playerTeamId);
      const playerDrivers = activeCareerRaceDrivers(playerTeamObj);
      const playerCarIds = playerDrivers.map(d => `${state.playerTeamId}-${d.code}`);
      const startCondition = (state.raceWeatherStart && state.raceWeatherStart.condition) || 'dry';
      const weather = { condition: startCondition };
      let grid = buildGrid(teamsList, state.playerTeamId, circuit, startCondition);
      const gridPosByKey = {};
      state.qualiResult.forEach(q => { gridPosByKey[`${q.teamId}-${q.code}`] = q.grid; });
      grid = grid.map(c => ({ ...c, gridPosition: gridPosByKey[c.id] || 99, position: gridPosByKey[c.id] || 99 }));
      const roleByCode = {};
      playerDrivers.forEach(d => { roleByCode[d.code] = d.role; });
      const tireChoice = state.preRaceTireChoice || {};
      grid = grid.map(c => {
        if (!c.isPlayer) return c;
        const chosen = tireChoice[roleByCode[c.code]];
        if (!chosen) return c;
        return { ...c, compound: chosen, compoundsUsed: [chosen] };
      });
      grid.sort((a, b) => a.gridPosition - b.gridPosition);
      const prevPositions = {}; grid.forEach(c => { prevPositions[c.id] = c.gridPosition; });
      return {
        ...state, phase: 'race', weather, grid, lap: 0, totalLaps: circuit.laps, flag: 'green', flagLapsRemaining: 0,
        eventLog: [mkEvent(0, `Grid definido em ${circuit.name}. ${startCondition === 'dry' ? 'Pista seca.' : 'Pista molhada na largada!'}`, 'info')],
        prevPositions, autoPlay: false, speed: 1, history: [], playerCarIds,
      };
    }
    case 'TICK': {
      if (state.phase !== 'race') return state;
      const lap = state.lap + 1;
      const result = simulateLap({ ...state, lap });
      const finished = lap >= state.totalLaps;
      const eventLog = [...state.eventLog, ...result.events].slice(-90);
      let nextState = {
        ...state, grid: result.finalCars, weather: result.newWeather, flag: result.newFlag,
        flagLapsRemaining: result.newFlagLapsRemaining, prevPositions: result.newPrevPositions, eventLog, lap,
        autoPlay: finished ? false : (result.pauseWorthy ? false : state.autoPlay),
        history: [...state.history, buildHistoryPoint(lap, result.finalCars, state.playerCarIds)].slice(-100),
      };
      if (finished) {
        if (state.mode === 'career') {
          const applied = applyCareerRaceResults(state.career, result.finalCars);
          const teamClone = { ...state.career.teams[state.playerTeamId] };
          const sponsorResult = processSponsorDealsAfterRace(teamClone, result.finalCars, state.playerTeamId);
          teamClone.sponsorDeals = sponsorResult.deals;
          const salaryTotal = teamClone.driverCodes.reduce((sum, code) => {
            const d = state.career.driverPool[code];
            return sum + (d ? (d.salary || 0) : 0);
          }, 0);
          teamClone.budget -= salaryTotal;
          const devInvest = teamClone.devInvest || {};
          const devSpend = UPGRADE_CATEGORIES.reduce((sum, c) => sum + (devInvest[c.id] || 0), 0);
          teamClone.budget -= devSpend;
          const newDevLevels = { ...(teamClone.devLevels || {}) };
          UPGRADE_CATEGORIES.forEach(c => {
            const invest = devInvest[c.id] || 0;
            const lvl = newDevLevels[c.id] != null ? newDevLevels[c.id] : DEV_BASELINE;
            const growth = invest * DEV_GROWTH_RATE * (1 - lvl / 100);
            newDevLevels[c.id] = clamp(lvl + growth, 0, 100);
          });
          teamClone.devLevels = newDevLevels;
          let racePrize = 0;
          result.finalCars.forEach(c => {
            if (c.teamId === state.playerTeamId && !c.dnf && c.position >= 1 && c.position <= 10) {
              racePrize += RACE_PRIZE_MONEY[c.position - 1];
            }
          });
          teamClone.budget += racePrize;
          const teams = { ...state.career.teams, [state.playerTeamId]: teamClone };
          const log = sponsorResult.log.length ? [...state.career.log, ...sponsorResult.log].slice(-40) : state.career.log;
          nextState.career = { ...state.career, driverStandings: applied.newDriverStandings, constructorStandings: applied.newConstructorStandings, teams, log, raceSequence: state.career.raceSequence + 1 };
          nextState.careerLastRaceApplied = { ...applied, salaryPaid: salaryTotal };
          nextState.phase = 'career-race-result';
        } else {
          nextState.phase = 'results';
        }
      }
      return nextState;
    }
    case 'SET_PACE_MODE':
      return { ...state, grid: state.grid.map(c => (c.id === action.carId ? { ...c, paceMode: action.mode } : c)) };
    case 'QUEUE_PIT':
      return { ...state, grid: state.grid.map(c => (c.id === action.carId ? { ...c, pendingPit: action.compound } : c)) };
    case 'CANCEL_PIT':
      return { ...state, grid: state.grid.map(c => (c.id === action.carId ? { ...c, pendingPit: null } : c)) };
    case 'TOGGLE_AUTOPLAY':
      return { ...state, autoPlay: !state.autoPlay };
    case 'SET_SPEED':
      return { ...state, speed: action.speed };

    default:
      return state;
  }
}

function act(obj) { return JSON.stringify(obj).replace(/"/g, '&quot;'); }

function wearBar(compound, wear, trackClass) {
  const def = COMPOUNDS[compound];
  const remaining = Math.max(0, 100 - wear);
  const tone = remaining > 40 ? def.color : remaining > 18 ? '#FFB020' : '#E8383D';
  return `<div class="${trackClass || 'w-16'} h-2 rounded-full bg-slate-700 overflow-hidden shrink-0"><div class="h-full rounded-full" style="width:${remaining}%; background-color:${tone}"></div></div>`;
}
function compoundDot(compound) {
  return `<span class="cm-mono text-xs font-semibold" style="color:${COMPOUNDS[compound].color}">${COMPOUNDS[compound].short}</span>`;
}
function skillBar(label, value) {
  const pct = value * 10;
  const tone = value >= 8 ? '#3ECF6E' : value >= 6 ? '#FFB020' : '#E8383D';
  return `
    <div class="mb-2">
      <div class="flex justify-between mb-0.5">
        <span class="cm-body text-xs text-slate-400">${label}</span>
        <span class="cm-mono text-xs text-slate-300">${value}/10</span>
      </div>
      <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full rounded-full" style="width:${pct}%; background-color:${tone}"></div>
      </div>
    </div>
  `;
}

function renderGapSvg(history, carA, carB) {
  const w = 600, h = 110, padL = 30, padR = 8, padT = 8, padB = 18;
  const laps = history.map(p => p.lap);
  const minLap = Math.min(...laps), maxLap = Math.max(...laps);
  const allVals = [];
  history.forEach(p => { if (p.a != null) allVals.push(p.a); if (p.b != null) allVals.push(p.b); });
  const minV = allVals.length ? Math.min(0, ...allVals) : 0;
  const maxV = allVals.length ? Math.max(1, ...allVals) : 1;
  const xScale = lap => padL + ((lap - minLap) / Math.max(1, (maxLap - minLap))) * (w - padL - padR);
  const yScale = v => padT + (1 - (v - minV) / Math.max(0.001, (maxV - minV))) * (h - padT - padB);
  const lineFor = (key) => history.filter(p => p[key] != null).map(p => `${xScale(p.lap)},${yScale(p[key])}`).join(' ');
  const ptsA = lineFor('a'), ptsB = lineFor('b');
  const colorA = carA ? carA.color : '#FFB020', colorB = carB ? carB.color : '#4FD1E8';
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-full">
    <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#1e293b" stroke-width="1"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h - padB}" stroke="#1e293b" stroke-width="1"/>
    ${ptsA ? `<polyline points="${ptsA}" fill="none" stroke="${colorA}" stroke-width="2"/>` : ''}
    ${ptsB ? `<polyline points="${ptsB}" fill="none" stroke="${colorB}" stroke-width="2"/>` : ''}
  </svg>`;
}

function renderGapChart(history, cars, playerCarIds) {
  const carA = cars.find(c => c.id === playerCarIds[0]);

  return `

  `;
}

function classificationRows(cars) {
  return cars.map(c => `
    <div class="flex items-center px-3 py-1 border-b border-slate-800 last:border-b-0 ${c.isPlayer ? 'bg-slate-800' : ''}">
      <span class="cm-mono text-xs w-6 text-slate-300">${c.position}</span>
      <div class="w-1.5 h-3.5 rounded-sm mx-2" style="background-color:${c.color}"></div>
      <span class="cm-body text-xs text-slate-100 flex-1 truncate">${c.name}</span>
      <span class="cm-mono text-xs text-slate-400">${c.dnf ? 'DNF' : fmtGap(c.gapToLeader)}</span>
    </div>
  `).join('');
}

function raceOutcomeSummary(state) {
  const classified = state.grid;
  const fastestCar = classified.reduce((best, c) => (c.bestLap && (!best || c.bestLap < best.bestLap) ? c : best), null);
  const playerCars = state.playerCarIds.map(id => classified.find(c => c.id === id)).filter(Boolean);
  let teamPoints = 0;
  const pointsFor = (c) => {
    if (c.dnf) return 0;
    let pts = POINTS[c.position - 1] || 0;
    if (fastestCar && fastestCar.id === c.id && c.position <= 10) pts += 1;
    return pts;
  };
  const playerCardsHtml = playerCars.map(c => {
    const pts = pointsFor(c); teamPoints += pts;
    return `<div class="bg-slate-900 border border-slate-800 rounded-md p-2">
      <div class="cm-body text-xs text-slate-100 truncate">${c.name}</div>
      <div class="cm-display text-xl font-bold text-amber-400">P${c.dnf ? '-' : c.position}</div>
      <div class="cm-mono text-xs text-slate-500">${c.dnf ? c.dnfReason : pts + ' pts'}</div>
    </div>`;
  }).join('');
  return { classified, fastestCar, playerCards: playerCardsHtml, teamPoints };
}

function renderResultsScreen(state) {
  const { classified, fastestCar, playerCards, teamPoints } = raceOutcomeSummary(state);
  const team = TEAMS.find(t => t.id === state.playerTeamId);
  return `

        ${fastestCar ? `<div class="cm-body text-xs text-cyan-300 mb-2">⚡ Volta mais rápida: ${fastestCar.name} — ${fmtLapTime(fastestCar.bestLap)}</div>` : ''}

      <div class="flex-1 min-h-0 overflow-y-auto bg-slate-900 border border-slate-800 rounded-md">${classificationRows(classified)}</div>

  `;

function renderCareerMarketScreen(state) {
  const career = state.career;
  const draft = state.contractUI || {};
  const mine = new Set(career.teams[state.playerTeamId].driverCodes);
  const all = Object.values(career.driverPool).filter(d => !d.retired && !mine.has(d.code));
  const free = all.filter(d => !d.teamId).sort((a, b) => b.pace - a.pace);
  const expiring = all.filter(d => d.teamId && d.contractYears <= 1).sort((a, b) => b.pace - a.pace);
  const locked = all.filter(d => d.teamId && d.contractYears > 1).sort((a, b) => b.pace - a.pace);

  const negotiableCard = (d) => {
    const isEditing = draft.targetCode === d.code;
    const team = d.teamId ? career.teams[d.teamId] : null;
    const situationTxt = !team ? 'agente livre' : d.contractYears <= 1 ? 'último ano de contrato' : `contrato · ${d.contractYears} anos restantes`;
    const onCooldown = d.cooldownUntilRaceSeq && career.raceSequence < d.cooldownUntilRaceSeq;
    return `
      <div class="bg-slate-900 border ${isEditing ? 'border-amber-500' : 'border-slate-800'} rounded-md p-3 mb-2">
        <div class="flex items-center justify-between mb-1">
          <button data-action="${act({ type: 'CAREER_VIEW_DRIVER', code: d.code })}" class="cm-display font-semibold text-slate-100 text-left">${d.name}</button>
          ${team ? `<span class="cm-mono text-xs" style="color:${team.color}">${team.short}</span>` : '<span class="cm-mono text-xs text-emerald-400">LIVRE</span>'}
        </div>
        <div class="cm-body text-xs text-slate-400 mb-2">${d.age} anos · ritmo ${d.pace}/10 · ${situationTxt} · pede ~${fmtMoney(estimateSalary(d))}/corrida</div>
        ${isEditing ? contractDraftPanel(draft, d.code, true) : `<button data-action="${act({ type: 'CONTRACT_DRAFT_START', code: d.code })}" ${onCooldown ? 'disabled' : ''} class="w-full ${onCooldown ? 'bg-slate-900 border border-slate-800 text-slate-600' : 'bg-slate-800 border border-slate-700 text-slate-300'} rounded-md py-1.5 cm-body text-xs">${onCooldown ? 'Aguardando resposta' : 'Negociar'}</button>`}
      </div>
    `;
  };

  return `
    <div class="h-full flex flex-col overflow-hidden">
      ${careerHeader(state, 'Mercado de Transferências')}
      <div class="flex-1 min-h-0 overflow-y-auto p-3">
        <p class="cm-body text-xs text-slate-500 mb-3">Você pode sondar qualquer piloto do grid — mas ele só topa conversar se estiver interessado. Pilotos com contrato longo raramente têm interesse. Se recusar, espere a corrida seguinte para tentar de novo.</p>
        <div class="cm-mono text-xs text-emerald-400 mb-1">AGENTES LIVRES (${free.length})</div>
        ${free.length ? free.map(negotiableCard).join('') : '<div class="cm-body text-xs text-slate-600 mb-2">Nenhum agente livre no momento.</div>'}
        <div class="cm-mono text-xs text-amber-400 mb-1 mt-3">ÚLTIMO ANO DE CONTRATO (${expiring.length})</div>
        ${expiring.length ? expiring.map(negotiableCard).join('') : '<div class="cm-body text-xs text-slate-600 mb-2">Nenhum piloto nessa situação agora.</div>'}
        <div class="cm-mono text-xs text-slate-500 mb-1 mt-3">SOB CONTRATO (${locked.length}) — pouco interesse, mas você pode tentar</div>
        ${locked.length ? locked.map(negotiableCard).join('') : '<div class="cm-body text-xs text-slate-600">Nenhum piloto nessa situação.</div>'}
      </div>
    </div>
  `;

function renderCareerSponsorsScreen(state) {

  const team = career.teams[state.playerTeamId];

    const perRace = d.totalValue / d.raceCount;
    return `
      <div class="bg-slate-900 border border-slate-800 rounded-md p-3 mb-2">
        <div class="flex items-center justify-between mb-1">
          <span class="cm-display font-semibold text-slate-100">${s ? s.name : d.sponsorId}</span>
          <span class="cm-mono text-xs text-slate-500">${s ? s.tier : ''}</span>
        </div>
        <div class="cm-body text-xs text-slate-400">${d.racesRemaining} de ${d.raceCount} corridas restantes · ${fmtMoney(perRace)}/corrida</div>
        ${d.winBonus ? `<div class="cm-body text-xs text-emerald-400 mt-1">🏆 bônus de ${fmtMoney(d.winBonus)} por vitória</div>` : ''}

  }).join('') : '<div class="cm-body text-xs text-slate-500">Nenhum patrocínio ativo ainda. Propostas aparecem automaticamente ao longo da temporada, após as corridas.</div>';

        <p class="cm-body text-xs text-slate-500 mb-3">Você não escolhe os patrocinadores — as propostas chegam sozinhas durante a temporada e, uma vez assinadas, valem até o fim do contrato.</p>
        <div class="cm-mono text-xs text-slate-500 mb-1">CONTRATOS ATIVOS (${deals.length})</div>

}

function renderCareerSponsorOfferScreen(state) {
  const offer = state.pendingSponsorOffer;
  if (!offer) return renderCareerHubScreen(state);
  const s = SPONSORS.find(sp => sp.id === offer.sponsorId);
  const perRace = offer.totalValue / offer.raceCount;
  return `
    <div class="h-full flex flex-col items-center justify-center p-6 text-center">
      <div class="cm-mono text-xs text-cyan-400 mb-2">PROPOSTA DE PATROCÍNIO</div>
      <div class="cm-display text-3xl font-bold text-slate-100 mb-1">${s ? s.name : offer.sponsorId}</div>
      <div class="cm-mono text-xs text-slate-500 mb-6">${s ? s.tier + ' · ' + s.category : ''}</div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-6 w-full max-w-xs">
        <div class="cm-display text-2xl font-bold text-amber-400">${offer.raceCount} corridas</div>
        <div class="cm-mono text-lg text-slate-100">${fmtMoney(offer.totalValue)}</div>
        <div class="cm-body text-xs text-slate-500 mb-2">≈ ${fmtMoney(perRace)} por corrida</div>
        ${offer.winBonus ? `<div class="cm-body text-sm text-emerald-400 mt-2 pt-2 border-t border-slate-800">🏆 + ${fmtMoney(offer.winBonus)} de bônus por vitória</div>` : '<div class="cm-body text-xs text-slate-600 mt-2 pt-2 border-t border-slate-800">sem cláusula de bônus por vitória</div>'}
      </div>
      <p class="cm-body text-xs text-slate-500 max-w-xs mb-6">Depois de assinado, o contrato não pode ser cancelado até o fim das ${offer.raceCount} corridas.</p>
      <div class="flex gap-2 w-full max-w-xs">
        <button data-action="${act({ type: 'DECLINE_SPONSOR_OFFER' })}" class="flex-1 bg-slate-800 border border-slate-700 rounded-md py-3 cm-body text-sm text-slate-300">Recusar</button>
        <button data-action="${act({ type: 'ACCEPT_SPONSOR_OFFER' })}" class="flex-1 bg-amber-500 text-slate-950 rounded-md py-3 cm-body text-sm font-semibold">Assinar</button>
      </div>
    </div>
  `;
}

function renderCareerRosterScreen(state) {
  const career = state.career;
  const team = career.teams[state.playerTeamId];
  const rows = team.driverCodes.map(code => {
    const d = career.driverPool[code]; if (!d) return '';
    return `
      <button data-action="${act({ type: 'CAREER_VIEW_DRIVER', code })}" class="w-full flex items-center justify-between bg-slate-900 border border-slate-800 rounded-md p-2.5 mb-1.5">
        <div class="text-left"><div class="cm-body text-sm text-slate-100">${d.name}</div><div class="cm-mono text-xs text-slate-500">${roleLabel(d.role)} · ${d.age} anos</div></div>
        <span class="cm-mono text-xs text-cyan-300">ver perfil →</span>
      </button>
    `;
  }).join('');
  return `<div class="h-full flex flex-col overflow-hidden">${careerHeader(state, 'Elenco')}<div class="flex-1 min-h-0 overflow-y-auto p-3">${rows}</div></div>`;
}

function renderCareerProfileScreen(state) {
  const career = state.career;
  const code = state.careerViewDriverCode;
  const d = career.driverPool[code];
  if (!d) return `<div class="h-full flex items-center justify-center cm-body text-slate-500">Piloto não encontrado.</div>`;
  const team = d.teamId ? career.teams[d.teamId] : null;
  return `
    <div class="h-full flex flex-col overflow-hidden">
      ${careerHeader(state, 'Perfil do piloto')}
      <div class="flex-1 min-h-0 overflow-y-auto p-4">
        <div class="flex items-center gap-2 mb-1">
          ${team ? `<span class="w-2.5 h-2.5 rounded-full" style="background-color:${team.color}"></span>` : ''}

        <div class="cm-mono text-xs text-slate-500 mb-4">${d.age} anos · ${team ? team.name : 'sem equipe'} · ${roleLabel(d.role)}${d.retired ? ' · APOSENTADO' : ''}</div>
        ${skillBar('Experiência', d.experience)}${skillBar('Acerto com o carro', d.carFeel)}${skillBar('Chuva', d.wet)}
        ${skillBar('Ultrapassagem', d.overtaking)}${skillBar('Largada', d.starts)}${skillBar('Concentração', d.focus)}
        ${skillBar('Físico', d.physical)}${skillBar('Rapidez', d.pace)}

    </div>

}

function renderCareerOffseasonScreen(state) {
  const career = state.career;
  const lastSeason = career.seasonHistory[career.seasonHistory.length - 1];
  const champCode = lastSeason ? lastSeason.driverChampionCode : null;
  const champ = champCode ? career.driverPool[champCode] : null;
  const constructorChamp = lastSeason ? career.teams[lastSeason.constructorChampionId] : null;
  const logHtml = (career.log || []).map(l => `<div class="cm-body text-xs text-slate-400 mb-1">• ${l}</div>`).join('');
  return `
    <div class="h-full flex flex-col overflow-hidden">
      <div class="shrink-0 safe-top bg-slate-950 border-b border-slate-800 px-3 py-3 text-center">
        <div class="cm-mono text-xs text-cyan-400">FIM DA TEMPORADA ${lastSeason ? lastSeason.year : career.year - 1}</div>
        <div class="cm-display text-2xl font-bold text-slate-100">Mercado de pilotos</div>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto p-3">
        ${champ ? `<div class="bg-slate-900 border border-amber-700 rounded-md p-3 mb-2"><div class="cm-mono text-xs text-amber-400">CAMPEÃO DE PILOTOS</div><div class="cm-display text-lg font-bold text-slate-100">🏆 ${champ.name} — ${lastSeason.driverChampionPoints} pts</div></div>` : ''}
        ${constructorChamp ? `<div class="bg-slate-900 border border-slate-800 rounded-md p-3 mb-3"><div class="cm-mono text-xs text-slate-500">CAMPEÃ DE CONSTRUTORES</div><div class="cm-display text-lg font-bold text-slate-100">🏆 ${constructorChamp.name}</div></div>` : ''}
        <div class="cm-mono text-xs text-slate-500 mb-1">NOTÍCIAS DA ENTRESSAFRA</div>
        <div class="bg-slate-950 border border-slate-800 rounded-md p-3">${logHtml || '<div class="cm-body text-xs text-slate-600">Sem mudanças notáveis.</div>'}</div>
      </div>
      <div class="shrink-0 p-3">
        <button data-action="${act({ type: 'CAREER_ACK_OFFSEASON' })}" class="w-full bg-amber-500 text-slate-950 cm-body font-semibold py-3 rounded-md">Continuar para ${career.year}</button>
      </div>

}

function renderCareerRaceResultScreen(state) {
  const { classified, fastestCar, playerCards, teamPoints } = raceOutcomeSummary(state);
  const career = state.career;
  const applied = state.careerLastRaceApplied || { pointsAwarded: {} };
  const driverRank = Object.entries(career.driverStandings).sort((a, b) => b[1] - a[1]);
  const constructorRank = Object.entries(career.constructorStandings).sort((a, b) => b[1] - a[1]);
  const myConstructorPos = constructorRank.findIndex(([id]) => id === state.playerTeamId) + 1;
  const isLastRound = career.roundIndex + 1 >= career.calendar.length;
  return `
    <div class="h-full flex flex-col p-3 sm:p-4 overflow-hidden">
      <div class="shrink-0">
        <div class="cm-mono text-xs text-slate-500 mb-1">RODADA ${career.roundIndex + 1}/${career.calendar.length} — ${state.circuit.name}</div>
        <h2 class="cm-display text-2xl font-bold mb-2 flex items-center gap-2"><span class="text-amber-400">🏆</span> Bandeirada</h2>
        <div class="grid grid-cols-2 gap-2 mb-2">${playerCards}</div>
        <div class="cm-body text-xs text-slate-300 mb-1">Pontos nesta corrida: <span class="text-amber-400 font-semibold">${teamPoints}</span> · Posição atual (construtores): <span class="text-cyan-300 font-semibold">P${myConstructorPos || '-'}</span></div>
        ${fastestCar ? `<div class="cm-body text-xs text-cyan-300 mb-2">⚡ Volta mais rápida: ${fastestCar.name} — ${fmtLapTime(fastestCar.bestLap)}</div>` : ''}
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto bg-slate-900 border border-slate-800 rounded-md">${classificationRows(classified)}</div>
      <div class="shrink-0 pt-2">
        <button data-action="${act({ type: 'CAREER_CONTINUE' })}" class="w-full bg-amber-500 text-slate-950 cm-body font-semibold py-2.5 rounded-md">${isLastRound ? 'Encerrar temporada →' : 'Continuar →'}</button>
      </div>
    </div>
  `;
}

/* ---------------- dispatcher e bootstrap ---------------- */

function renderApp(state) {
  const p = state.phase;
  if (p === 'menu') return renderMenuScreen();
  if (p === 'mode') return renderModeScreen();
  if (p === 'team') return renderTeamSelectScreen();
  if (p === 'circuit') return renderCircuitSelectScreen(state);
  if (p === 'quali') return renderQualiScreen(state);
  if (p === 'race') return renderRaceScreen(state);
  if (p === 'results') return renderResultsScreen(state);
  if (p === 'career-team') return renderCareerTeamSelectScreen();
  if (p === 'career-hub') return renderCareerHubScreen(state);
  if (p === 'career-calendar') return renderCareerCalendarScreen(state);
  if (p === 'career-standings') return renderCareerStandingsScreen(state);
  if (p === 'career-contracts') return renderCareerContractsScreen(state);
  if (p === 'career-market') return renderCareerMarketScreen(state);
  if (p === 'career-sponsor-offer') return renderCareerSponsorOfferScreen(state);
  if (p === 'career-upgrades') return renderCareerUpgradesScreen(state);
  if (p === 'career-sponsors') return renderCareerSponsorsScreen(state);
  if (p === 'career-roster') return renderCareerRosterScreen(state);
  if (p === 'career-profile') return renderCareerProfileScreen(state);
  if (p === 'career-offseason') return renderCareerOffseasonScreen(state);
  if (p === 'career-race-result') return renderCareerRaceResultScreen(state);
  return `<div class="h-full flex items-center justify-center cm-body text-slate-500">tela desconhecida: ${p}</div>`;
}

const SAVE_KEY = 'pitwallManagerSaveV1';

function saveCareerToStorage(s) {
  if (s.mode !== 'career' || !s.career) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ playerTeamId: s.playerTeamId, career: s.career }));
  } catch (e) { /* storage unavailable (private mode / sandboxed preview / quota) — game still runs, just without persistence */ }
}

function loadCareerFromStorage() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.career || !parsed.career.driverPool || !parsed.career.teams || !parsed.playerTeamId) return null;
    if (!parsed.career.teams[parsed.playerTeamId]) return null;
    return parsed;
  } catch (e) { return null; }
}

function clearCareerStorage() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

const SAVED_CAREER = loadCareerFromStorage();

let state = { ...initialState };
let autoplayTimer = null;

function dispatch(action) {
  if (action.type === 'RESET') clearCareerStorage();
  state = reducer(state, action);
  saveCareerToStorage(state);
  render();
}

function scheduleAutoplay() {
  clearTimeout(autoplayTimer);
  if (state.phase === 'race' && state.autoPlay) {
    const ms = state.speed === 4 ? 260 : state.speed === 2 ? 600 : 1300;
    autoplayTimer = setTimeout(() => dispatch({ type: 'TICK' }), ms);
  }
}

function render() {
  const root = document.getElementById('root');
  const timingEl = document.getElementById('timing-tower-scroll');
  const timingScroll = timingEl ? timingEl.scrollTop : null;
  const eventEl = document.getElementById('event-terminal-scroll');
  const eventWasAtBottom = eventEl ? (eventEl.scrollHeight - eventEl.scrollTop - eventEl.clientHeight < 20) : true;
  const eventScroll = eventEl ? eventEl.scrollTop : null;
  const gapDetailsEl = document.getElementById('gap-details');
  const gapOpen = gapDetailsEl ? gapDetailsEl.open : false;
  const eventDetailsEl = document.getElementById('event-details');
  const eventOpen = eventDetailsEl ? eventDetailsEl.open : false;

  root.innerHTML = renderApp(state);

  const newTimingEl = document.getElementById('timing-tower-scroll');
  if (newTimingEl && timingScroll != null) newTimingEl.scrollTop = timingScroll;
  const newEventEl = document.getElementById('event-terminal-scroll');
  if (newEventEl) newEventEl.scrollTop = eventWasAtBottom ? newEventEl.scrollHeight : (eventScroll != null ? eventScroll : newEventEl.scrollHeight);
  const newGapDetailsEl = document.getElementById('gap-details');
  if (newGapDetailsEl) newGapDetailsEl.open = gapOpen;
  const newEventDetailsEl = document.getElementById('event-details');
  if (newEventDetailsEl) newEventDetailsEl.open = eventOpen;

  scheduleAutoplay();
}

document.getElementById('root').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = JSON.parse(btn.getAttribute('data-action'));
  dispatch(action);
});

render();
</script></body></html>
